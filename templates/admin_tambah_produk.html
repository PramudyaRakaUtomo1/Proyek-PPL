<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Produk - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f3f0] font-sans h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Tambah Produk</h2>
        
        <form action="/admin/produk/tambah" method="POST" class="space-y-5">
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Nama Produk</label>
                <input type="text" name="nama" required class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841] focus:ring-1 focus:ring-[#f5b841]">
            </div>
            
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Harga (Rp)</label>
                <input type="number" name="harga" required class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841] focus:ring-1 focus:ring-[#f5b841]">
            </div>
            
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Kategori</label>
                <select name="kategori_id" required class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841]">
                    <!-- Jika diuji tanpa database lengkap, opsi ini bisa dibuat manual sementara -->
                    <option value="1">Ricebowl</option>
                    <option value="2">Tost</option>
                    <option value="3">Kopi</option>
                </select>
            </div>

            <div>
                <label class="block text-gray-800 font-semibold mb-2">Status</label>
                <select name="status" class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841]">
                    <option value="Ready">Ready</option>
                    <option value="Habis">Habis</option>
                </select>
            </div>

            <div class="flex gap-3 mt-8">
                <a href="/admin/produk" class="flex-1 py-3 text-center rounded-lg bg-gray-200 text-gray-700 font-bold hover:bg-gray-300">Batal</a>
                <button type="submit" class="flex-1 py-3 rounded-lg bg-[#1a1714] text-white font-bold hover:bg-black">Simpan Produk</button>
            </div>
        </form>
    </div>

</body>
</html>
