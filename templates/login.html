<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Pegawai - Jotoast</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f4f3f0] font-sans h-screen flex items-center justify-center relative">
    
    <!-- Tombol Kembali -->
    <a href="/" class="absolute top-8 left-8 bg-white px-5 py-2.5 rounded-lg font-bold text-gray-700 shadow-sm border border-gray-200 hover:bg-gray-50 transition">
        &larr; Kembali ke Beranda
    </a>

    <!-- Form Login -->
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">Login Pegawai</h2>
        {% if error %}
        <p class="text-red-500 text-sm mb-4 text-center">{{ error }}</p>
        {% endif %}
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Username</label>
                <input type="text" name="username" required class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841]">
            </div>
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Kata Sandi</label>
                <input type="password" name="password" required class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841]">
            </div>
            <div>
                <label class="block text-gray-800 font-semibold mb-2">Masuk Sebagai</label>
                <select name="role" class="w-full p-3 border border-gray-300 rounded-lg focus:border-[#f5b841]">
                    <option value="owner">Owner / Admin</option>
                    <option value="kasir">Kasir</option>
                </select>
            </div>
            <button type="submit" class="w-full py-3 rounded-lg bg-[#1a1714] text-white font-bold hover:bg-black transition mt-4">Masuk</button>
        </form>
    </div>
</body>
</html>
