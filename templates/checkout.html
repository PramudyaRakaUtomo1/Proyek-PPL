<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Jotoast</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex justify-center">
    <div class="w-full max-w-md bg-[#F4F3F0] min-h-screen relative shadow-xl">
        
        <!-- Header dengan Tombol Kembali -->
        <div class="bg-[#1a1714] px-6 py-6 flex items-center gap-4">
            <a href="/" class="text-white bg-gray-700 px-4 py-2 rounded-lg hover:bg-gray-600 transition font-bold text-sm">
                &larr; Kembali
            </a>
            <h1 class="text-white text-2xl font-bold tracking-tight">Checkout</h1>
        </div>

        <!-- Form Checkout -->
        <div class="p-6">
            <form action="/checkout" method="POST" class="space-y-5">
                <div>
                    <label class="block text-gray-800 font-semibold mb-2">Nama Pemesan</label>
                    <input type="text" name="nama_pemesan" required placeholder="Misal: Budi" class="w-full p-4 border border-gray-300 rounded-xl focus:border-[#f5b841]">
                </div>
                <div>
                    <label class="block text-gray-800 font-semibold mb-2">Metode Pembayaran</label>
                    <select name="metode_bayar" class="w-full p-4 border border-gray-300 rounded-xl focus:border-[#f5b841]">
                        <option value="Tunai di Kasir">Bayar di Kasir</option>
                    </select>
                </div>
                <button type="submit" class="w-full mt-8 bg-[#f5b841] text-gray-900 px-6 py-4 rounded-xl font-bold shadow-lg hover:bg-yellow-500 transition text-lg">Buat Pesanan</button>
            </form>
        </div>
    </div>
</body>
</html>
